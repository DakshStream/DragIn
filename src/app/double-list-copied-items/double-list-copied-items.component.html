<div class="container">
    <div class="list-one"
        cdkDropList
        #availableList="cdkDropList"
        [cdkDropListData]="available"
        [cdkDropListConnectedTo]="[assignedList]"
        (cdkDropListDropped)="drop($event)">
        <!--  [cdkDropListDisabled]="true" -->
        <!--  cdkDropListOrientation="horizontal" -->
        <!--  -->
        <!--  -->

            <div *ngFor="let item of available" cdkDrag class="avail-list"> 
                <!-- [cdkDragDisabled]="true"-->
                <!--  cdkDragLockAxis="x", "y" -->
                <!--  cdkDragBoundary=".container" -->
                <!-- cdkDragStarted, ended, moved, released, cdkDropListDropped, entered, exited, sorted -->
                {{item}}
                <div *cdkDragPlaceholder>Available List..</div>
                <div *cdkDragPreview>MOVINGGG</div>
            </div>


    </div>

    <div class="list-two"
        cdkDropList
        #assignedList="cdkDropList"
        [cdkDropListData]="assigned"
        [cdkDropListConnectedTo]="[availableList]"
        (cdkDropListDropped)="drop($event)">

            <div *ngFor="let item of assigned" cdkDrag class="assi-list">
                {{item}}
                <div *cdkDragPlaceholder>Assigned List..</div>
            </div>
        
    </div>
    <div class="drag-btn" cdkDrag>
        <button cdkDragHandle>Drag</button>
    </div>
</div>
